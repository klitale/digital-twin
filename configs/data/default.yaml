# Dataset construction parameters (Phase 2). The whole file is copied into
# data/processed/dataset_manifest.json so any dataset can be reproduced.
version: 1
turns:
  merge_window_seconds: 180      # consecutive messages from one sender closer than this form one turn
context:
  max_turns: 6                   # preceding turns kept as context
  max_age_seconds: 7200          # context turns ending earlier than this before the reply are dropped
  require_partner_last: true     # the turn right before the reply must be the partner's
reply:
  min_chars: 3
  max_chars: 2000                # longer replies are dropped and counted (section 5.4 flags them)
  drop_no_words: true            # emoji / punctuation only replies
  drop_bare_links: true
  exclude_forwarded: true        # forwarded messages are not the twin's words
anonymize:
  phones: true
  emails: true
  cards: true
  token_urls: true               # URLs carrying tokens, keys or invite codes -> <url>
  mentions: true                 # @username -> @user
filters:
  min_date: 2021-01-01           # ISO date (UTC); earlier pairs are dropped and counted (style drift, see profile report)
split:
  tail_fraction: 0.15            # last share of each chat's pairs (by time) -> holdout tail (~1100 pairs with min_date 2021)
  min_pairs_per_chat: 20         # shorter chats contribute no holdout (noted in the manifest)
  eval_sample_size: 80           # pairs sampled from the tail for evaluation
  stratify_by: month
  seed: 20260905
